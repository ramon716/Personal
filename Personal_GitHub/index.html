<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Personal</title>
<meta name="theme-color" content="#0f3d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Personal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;background:#0f3d24;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f3}
#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font:600 16px system-ui,sans-serif;background:#0f3d24;transition:opacity .4s}
#sp img{width:110px;height:110px;border-radius:24px}
#sp a{color:#fff;opacity:.85;font-size:13px}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwIwUy-i4JqPfbL5BZJOUkb-XIdVlOOxTUtXoe4p43uQ3lFiNnEZGC3qhtxIePDLatksg/exec" allow="clipboard-write; fullscreen; geolocation; camera *; microphone *" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="sp"><img src="icon-512.png" alt=""><div>Control de Personal</div><div style="font-weight:400;font-size:13px;opacity:.8">Cargando…</div>
<a id="alt" href="https://script.google.com/macros/s/AKfycbwIwUy-i4JqPfbL5BZJOUkb-XIdVlOOxTUtXoe4p43uQ3lFiNnEZGC3qhtxIePDLatksg/exec" target="_top" style="display:none">¿No carga? Tocá acá para abrir</a></div>
<script>
var sp=document.getElementById('sp');
document.getElementById('app').addEventListener('load',function(){ sp.style.opacity=0; setTimeout(function(){sp.style.display='none';},450); });
setTimeout(function(){ document.getElementById('alt').style.display='block'; },8000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
